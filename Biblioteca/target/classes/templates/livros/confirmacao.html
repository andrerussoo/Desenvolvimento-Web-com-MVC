<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de Cadastro</title>
</head>
<body>
<h1>Livro cadastrado!</h1>
<p>Título:
    <span th:text="${livro.titulo}"></span>
</p>
<p>Autor:
    <span th:text="${livro.autor}"></span>
</p>
<p>ISBN:
    <span th:text="${livro.isbn}"></span>
</p>
<a th:href="@{/livros}">Voltar para a lista de livros</a>
</body>
</html>
